<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c24">
<title>Para ti, mi amor ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff6f9c;--glow:#ff4f86;--soft:#ffd7e4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{margin:0;height:100%;overflow:hidden;background:#0b0c24;color-scheme:dark}
  body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#0b0c24}
  #bgfill{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:0;pointer-events:none;background:#0b0c24;background-image:radial-gradient(ellipse at 50% 25%,#26286a 0%,#121339 45%,#07081a 100%)}
  #fx,#bgwrap{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  #fx{z-index:20}
  body{color:var(--soft);font-family:'Playfair Display',serif;user-select:none}
  #sky{position:fixed;inset:0;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw var(--d) ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
  .shoot{position:absolute;width:120px;height:1px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:shoot 1.2s ease-out forwards}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-25deg)}10%{opacity:1}100%{opacity:0;transform:translate(-300px,140px) rotate(-25deg)}}

  .screen{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1s ease}
  .hidden{opacity:0;pointer-events:none}
  .hidden *{pointer-events:none!important}

  #intro h1{font-weight:400;font-style:italic;font-size:clamp(28px,6vw,48px);margin:0 0 8px;text-shadow:0 0 14px #ff8fb3}
  #intro p{font-family:Poppins;font-weight:300;letter-spacing:3px;font-size:13px;margin:0 0 40px;opacity:.8}
  #heart{font-size:clamp(130px,30vw,200px);line-height:1;color:var(--pink);text-shadow:0 0 30px var(--glow),0 0 60px rgba(255,79,134,.5);cursor:pointer;animation:beat 1.2s infinite;transition:transform .9s ease,opacity .9s ease}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
  #heart.open{animation:none;transform:scale(5);opacity:0}
  .tap{font-family:Poppins;font-size:12px;letter-spacing:2px;margin-top:30px;opacity:.6;animation:fade 2s infinite}
  @keyframes fade{50%{opacity:.2}}
  @media (max-width:500px){#intro p{margin-bottom:28px}#lang{letter-spacing:3px;font-size:12px}.btn{padding:12px 28px}#final p{font-size:14px}}

  #bgheart{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(90vw,90vh);line-height:1;color:var(--pink);opacity:0;transition:opacity 2s;pointer-events:none;text-shadow:0 0 80px var(--glow)}
  #bgheart.on{opacity:.08;animation:slowbeat 2.4s infinite}
  @keyframes slowbeat{0%,100%{transform:translate(-50%,-50%) scale(1)}20%{transform:translate(-50%,-50%) scale(1.04)}}
  #word{max-width:100%;padding:0 16px;white-space:nowrap;font-style:italic;font-size:clamp(40px,10vw,84px);color:#fff;text-shadow:0 0 18px #ff8fb3,0 0 40px var(--glow);transition:opacity .6s,transform .6s;min-height:1.3em;line-height:1.2}
  #lang{font-family:Poppins;font-weight:400;letter-spacing:5px;font-size:13px;margin-top:14px;transition:opacity .6s;opacity:.85}
  #count{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;font-family:Poppins;font-size:11px;letter-spacing:2px;opacity:.45}
  .fadeout{opacity:0!important;transform:translateY(-10px)}

  #question h2{font-weight:400;font-style:italic;font-size:clamp(30px,7vw,52px);margin:0 0 36px;text-shadow:0 0 14px #ff8fb3}
  .btns{position:relative;display:flex;gap:18px;justify-content:center}
  .btn{font-family:Poppins;font-size:16px;border:0;border-radius:30px;padding:12px 34px;cursor:pointer}
  #yes{background:var(--glow);color:#fff;box-shadow:0 0 20px var(--glow);transition:transform .3s;position:relative;z-index:2}
  
  #no{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);transition:left .25s,top .25s}
  #no.free{position:fixed}
  #noMsg{font-family:Poppins;font-size:14px;margin-top:40px;padding:0 16px;max-width:360px;min-height:20px;opacity:.75}

  #final h2{font-weight:400;font-style:italic;font-size:clamp(34px,8vw,60px);margin:0 0 16px;color:#fff;text-shadow:0 0 18px #ff8fb3,0 0 40px var(--glow)}
  #final p{font-family:Poppins;font-weight:300;font-size:15px;line-height:1.8;max-width:460px;margin:0 0 30px;opacity:.9}
  #again{background:transparent;color:var(--soft);border:1px solid rgba(255,215,228,.4);font-size:13px;padding:9px 22px}

  .burst{position:absolute;pointer-events:none;color:var(--pink);text-shadow:0 0 10px var(--glow);animation:fly var(--t) ease-out forwards;z-index:20}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:0}}
  .rain{position:absolute;top:-40px;pointer-events:none;color:var(--pink);text-shadow:0 0 10px var(--glow);animation:fall var(--t) linear forwards;z-index:20}
  @keyframes fall{to{transform:translateY(calc(100vh + 80px)) rotate(var(--r))}}

  #music{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,215,228,.35);background:rgba(255,255,255,.08);color:var(--soft);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #music.off{opacity:.5}
  #music{display:none}
  #music.ready{display:flex}

  #vinyl h2{font-weight:400;font-style:italic;font-size:clamp(26px,6vw,40px);margin:0 0 10px;color:#fff;text-shadow:0 0 14px #ff8fb3}
  #vinyl p{font-family:Poppins;font-weight:300;font-size:15px;line-height:1.7;max-width:320px;margin:0 0 30px;opacity:.9}
  .disc{width:min(56vw,230px);height:min(56vw,230px);border-radius:50%;background:repeating-radial-gradient(circle,#0d0d12 0 3px,#1c1c26 3px 6px);display:flex;align-items:center;justify-content:center;margin-bottom:34px;box-shadow:0 0 40px rgba(255,79,134,.45),inset 0 0 0 2px rgba(255,255,255,.06);animation:spin 3.2s linear infinite;animation-play-state:paused;position:relative}
  .disc:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 40%,transparent 60%,rgba(255,255,255,.06))}
  .disc div{width:36%;height:36%;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(22px,6vw,34px);box-shadow:0 0 0 4px rgba(0,0,0,.3)}
  #vinyl.playing .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  #play{background:var(--glow);color:#fff;box-shadow:0 0 20px var(--glow)}

  #photos{position:fixed;inset:0;overflow:hidden;z-index:4;pointer-events:none}
  .pol{position:absolute;top:0;width:clamp(100px,28vw,160px);animation:pfall var(--t) linear forwards;cursor:pointer;pointer-events:auto}
  .pol .in{background:#fff;padding:6px 6px 22px;box-shadow:0 8px 18px rgba(0,0,0,.45);animation:sway var(--s) ease-in-out infinite alternate;transform-origin:50% 0}
  .pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;pointer-events:none}
  @keyframes pfall{from{transform:translateY(-110%)}to{transform:translateY(calc(100vh + 40px))}}
  @keyframes sway{from{transform:translateX(-14px) rotate(calc(var(--r) - 7deg))}to{transform:translateX(14px) rotate(calc(var(--r) + 7deg))}}
  #final{z-index:5;pointer-events:none}
  #final h2,#final p{text-shadow:0 0 18px #ff8fb3,0 0 40px var(--glow),0 2px 8px rgba(0,0,0,.8)}
  #final .btn{pointer-events:auto}
  #zoom{position:fixed;inset:0;z-index:40;background:rgba(5,6,20,.82);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
  #zoom.on{opacity:1;pointer-events:auto}
  #zoom .in{background:#fff;padding:10px 10px 40px;box-shadow:0 10px 40px rgba(0,0,0,.6);transform:scale(.8) rotate(-3deg);transition:transform .4s}
  #zoom.on .in{transform:scale(1) rotate(-2deg)}
  #zoom img{display:block;max-width:min(82vw,520px);max-height:70vh;object-fit:contain}
</style>
</head>
<body>
<div id="bgfill"></div>
<div id="sky"></div>
<div id="bgwrap"><div id="bgheart">♥</div></div>
<div id="fx"></div>
<button id="music" aria-label="Pausar o reanudar la música" title="Música">♫</button>
<audio id="song" src="cancion.mp3" loop preload="metadata"></audio>

<section id="intro" class="screen">
  <h1>Para ti, mi amor</h1>
  <p>TENGO ALGO QUE DECIRTE</p>
  <div id="heart" role="button" aria-label="Abrir el corazón">♥</div>
  <div class="tap">PULSA EL CORAZÓN</div>
</section>

<section id="vinyl" class="screen hidden">
  <div class="disc"><div>♥</div></div>
  <h2>Bueno amor…</h2>
  <p>Esto te va a sonar mejor con tu canción favorita 🎶</p>
  <button class="btn" id="play">Dale al play ▶</button>
</section>

<section id="words" class="screen hidden">
  <div id="word"></div>
  <div id="lang"></div>
  <div id="count"></div>
</section>

<section id="question" class="screen hidden">
  <h2>¿Y tú me quieres?</h2>
  <div class="btns"><button class="btn" id="yes">Sí</button><button class="btn" id="no">No</button></div>
  <div id="noMsg"></div>
</section>

<div id="photos"></div>
<div id="zoom"><div class="in"><img alt="Foto nuestra"></div></div>

<section id="final" class="screen hidden">
  <h2>Te quiero, mi amor</h2>
  <p>En todos los idiomas del mundo, y en los que aún no existen.</p>
  <button class="btn" id="again">Ver otra vez ♥</button>
</section>

<script>
const LANGS=[
 ["Te quiero","España"],["I love you","Reino Unido"],["Je t'aime","Francia"],["Ti amo","Italia"],
 ["Amo-te","Portugal"],["Ich liebe dich","Alemania"],["T'estimo","Cataluña"],["Maite zaitut","País Vasco"],
 ["Quérote","Galicia"],["Ik hou van jou","Países Bajos"],["Jag älskar dig","Suecia"],["Jeg elsker deg","Noruega"],
 ["Jeg elsker dig","Dinamarca"],["Minä rakastan sinua","Finlandia"],["Ég elska þig","Islandia"],["Tá grá agam duit","Irlanda"],
 ["Rwy'n dy garu di","Gales"],["Kocham cię","Polonia"],["Miluji tě","República Checa"],["Szeretlek","Hungría"],
 ["Te iubesc","Rumanía"],["Volim te","Croacia"],["Я тебя люблю","Rusia"],["Я тебе кохаю","Ucrania"],
 ["Σ'αγαπώ","Grecia"],["Seni seviyorum","Turquía"],["أحبك","Marruecos"],["אני אוהב אותך","Israel"],
 ["دوستت دارم","Irán"],["मैं तुमसे प्यार करता हूँ","India"],["愛してる","Japón"],["我爱你","China"],
 ["사랑해","Corea del Sur"],["Anh yêu em","Vietnam"],["ผมรักคุณ","Tailandia"],["Aku cinta kamu","Indonesia"],
 ["Mahal kita","Filipinas"],["Nakupenda","Kenia"],["Aloha au iā ʻoe","Hawái"],["Eu te amo","Brasil"],
 ["Te amo","Antigua Roma"]
];
const $=id=>document.getElementById(id);
const visible=id=>!$(id).classList.contains('hidden');
const show=id=>$(id).classList.remove('hidden'), hide=id=>$(id).classList.add('hidden');

/* Cielo */
const sky=$('sky');
for(let i=0;i<160;i++){const s=document.createElement('div');s.className='star';const z=Math.random()*2+.5;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;--d:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;opacity:${.4+Math.random()*.6}`;sky.appendChild(s)}
setInterval(()=>{const s=document.createElement('div');s.className='shoot';s.style.left=(40+Math.random()*60)+'%';s.style.top=(Math.random()*40)+'%';sky.appendChild(s);setTimeout(()=>s.remove(),1300)},5000);

/* Lluvia de corazones al tocar */
function burst(x,y,n=10){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='burst';h.textContent='♥';const a=Math.random()*Math.PI*2,d=50+Math.random()*90;h.style.cssText=`left:${x}px;top:${y}px;font-size:${12+Math.random()*18}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--r:${Math.random()*60-30}deg;--t:${.9+Math.random()*.6}s`;$('fx').appendChild(h);setTimeout(()=>h.remove(),1600)}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('#music,#no,.pol,#zoom'))return;burst(e.clientX,e.clientY)});
function rain(n=70){for(let i=0;i<n;i++)setTimeout(()=>{const h=document.createElement('div');h.className='rain';h.textContent='♥';h.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*26}px;--t:${3+Math.random()*3}s;--r:${Math.random()*360}deg`;$('fx').appendChild(h);setTimeout(()=>h.remove(),6500)},i*60)}

/* Música */
const song=$('song'),mbtn=$('music');let musicOn=false,hasSong=true;
const noSong=()=>{hasSong=false;mbtn.style.display='none'};
song.addEventListener('error',noSong);if(song.error)noSong();
function setMusic(on){if(!hasSong)return;musicOn=on;mbtn.classList.toggle('off',!on);mbtn.textContent=on?'♫':'♪';if(on)song.play().catch(()=>{});else song.pause()}
mbtn.onclick=()=>setMusic(!musicOn);
mbtn.classList.add('off');

/* Corazón → idiomas */
let timer;
$('heart').onclick=()=>{
  if(!visible('intro')||$('heart').classList.contains('open'))return;
  $('heart').classList.add('open');
  hide('intro');
  $('bgheart').classList.add('on');
  setTimeout(()=>{if(hasSong&&!vinylDone)show('vinyl');else{show('words');runWords()}},900);
};
let vinylDone=false;
$('play').onclick=()=>{
  if(!visible('vinyl'))return;
  vinylDone=true;
  if($('vinyl').classList.contains('playing'))return;
  $('vinyl').classList.add('playing');$('play').textContent='Sonando… 🎶';
  setMusic(true);mbtn.classList.add('ready');
  setTimeout(()=>{hide('vinyl');setTimeout(()=>{show('words');runWords()},900)},2600);
};
let runId=0;
function runWords(){
  const id=++runId;clearTimeout(timer);
  let i=0,step=2600;const w=$('word'),l=$('lang'),c=$('count');
  const next=()=>{
    if(id!==runId)return;
    const fade=Math.round(Math.min(600,step*0.3));
    w.style.transition=l.style.transition=`opacity ${fade}ms, transform ${fade}ms`;
    w.classList.add('fadeout');l.classList.add('fadeout');
    if(i>=LANGS.length){setTimeout(()=>{hide('words');show('question')},900);return}
    setTimeout(()=>{if(id!==runId)return;w.textContent=LANGS[i][0];l.textContent=LANGS[i][1].toUpperCase();c.textContent=`${i+1} / ${LANGS.length}`;fit(w);w.classList.remove('fadeout');l.classList.remove('fadeout');i++;
      step=Math.max(380,step*0.88);timer=setTimeout(next,i>=LANGS.length?2200:step)},fade);
  };
  next();
}
function fit(el){el.style.fontSize='';const max=innerWidth-32;let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>max&&fs>18){fs-=2;el.style.fontSize=fs+'px'}}
/* Lluvia de fotos */
const PHOTOS=[1,2,3,4,5,6,7,8,9].map(n=>`fotos/${n}.jpg`).sort(()=>Math.random()-.5);
let photoTimer,photoIdx=0;
function dropPhoto(){
  if(!PHOTOS.length)return;
  const src=PHOTOS[photoIdx++%PHOTOS.length],el=document.createElement('div'),t=13+Math.random()*5;
  el.className='pol';el.innerHTML=`<div class="in"><img src="${src}" alt="Foto nuestra" loading="lazy"></div>`;
  el.style.left=(Math.random()*(100-28))+'vw';
  el.style.setProperty('--t',t+'s');el.style.setProperty('--s',(2.2+Math.random()*1.6)+'s');el.style.setProperty('--r',(Math.random()*16-8)+'deg');
  el.onclick=()=>{$('zoom').querySelector('img').src=src;$('zoom').classList.add('on')};
  $('photos').appendChild(el);setTimeout(()=>el.remove(),t*1000+200);
}
function startPhotos(){if(!PHOTOS.length)return;dropPhoto();photoTimer=setInterval(dropPhoto,innerWidth<600?2600:1800)}
function stopPhotos(){clearInterval(photoTimer);$('photos').innerHTML=''}
$('zoom').onclick=()=>$('zoom').classList.remove('on');
PHOTOS.forEach(src=>{const i=new Image();i.src=src});

/* Pregunta trampa */
const noMsgs=["¿Seguro? 🥺","Piénsalo bien…","Ese botón no funciona","Inténtalo otra vez 😏","Casi…","¡Que no te dejo!",
 "Me vas a romper el corazón 💔","Ese botón está de adorno","Te estoy viendo, ¿eh? 👀","El Sí está ahí, muy cerquita",
 "Error 404: «No» no encontrado","Ni con el dedo más rápido del mundo","Mira qué grande se está poniendo el Sí",
 "Llevas {n} intentos, me estoy riendo 😂","¿Tú sabes lo que he tardado en hacer esto?","Último aviso 😤",
 "Vale, ahora sí que es el último aviso","Rendirse también es de valientes","Ya sabes que me quieres, tonta ♥",
 "Solo vale el Sí ♥","QUIEREMEEEEEEEEE"];
let noCount=0;
const no=$('no');
function flee(e){if(e)e.preventDefault();const r=no.getBoundingClientRect();no.classList.add('free');const pad=20,W=innerWidth-r.width-pad,H=innerHeight-r.height-pad;const Y=$('yes').getBoundingClientRect(),gap=24;let x,y,t=0;do{x=pad+Math.random()*(W-pad);y=pad+Math.random()*(H-pad);t++}while(t<200&&(Math.hypot(x-r.left,y-r.top)<120||(x<Y.right+gap&&x+r.width>Y.left-gap&&y<Y.bottom+gap&&y+r.height>Y.top-gap)));no.style.left=x+'px';no.style.top=y+'px';const m=noCount<noMsgs.length?noMsgs[noCount]:noMsgs[noMsgs.length-1];noCount++;$('noMsg').textContent=m.replace('{n}',noCount);$('yes').style.transform=`scale(${Math.min(1+noCount*0.07,1.8)})`}
no.addEventListener('mouseenter',flee);no.addEventListener('touchstart',flee,{passive:false});no.addEventListener('click',flee);
$('yes').onclick=()=>{if(!visible('question'))return;hide('question');no.classList.remove('free');no.style.left=no.style.top='';rain();setTimeout(()=>{show('final');startPhotos()},400)};

$('again').onclick=()=>{if(!visible('final'))return;runId++;clearTimeout(timer);hide('final');stopPhotos();$('heart').classList.remove('open');$('bgheart').classList.remove('on');$('noMsg').textContent='';noCount=0;$('yes').style.transform='';show('intro')};
</script>
</body>
</html>
